<!-- index.html
     HTML + CSS + JavaScript
     GitHub Pages compatible
     
     ملاحظة تقنية:
     التعديلات تُحفظ في localStorage، أي على نفس المتصفح والجهاز.
     GitHub Pages موقع ثابت ولا يستطيع حفظ تعديلات الزوار داخل ملفات GitHub.
-->

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="روابط نيون ثلاثية الأبعاد">
  <title>روابطي</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --purple: #b967ff;
      --purple-light: #e5b8ff;
      --white: #ffffff;
      --black: #050507;
      --gray: #a8a8b3;
      --glass: rgba(255, 255, 255, 0.055);
      --border: rgba(210, 150, 255, 0.28);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      color: var(--white);
      font-family: Arial, Tahoma, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(185, 103, 255, .22), transparent 28%),
        radial-gradient(circle at 85% 15%, rgba(255, 255, 255, .08), transparent 22%),
        radial-gradient(circle at 80% 85%, rgba(185, 103, 255, .18), transparent 30%),
        linear-gradient(135deg, #030305 0%, #09060e 45%, #020203 100%);
      overflow-x: hidden;
    }

    /* خلفية زخرفية */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .28;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 45px 45px;
      mask-image: linear-gradient(to bottom, black, transparent);
    }

    .glow {
      position: fixed;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .18;
      background: var(--purple);
      pointer-events: none;
    }

    .glow.one {
      top: 5%;
      left: -100px;
    }

    .glow.two {
      right: -100px;
      bottom: 5%;
    }

    .container {
      width: min(1000px, calc(100% - 28px));
      margin: auto;
      padding: 55px 0 70px;
      position: relative;
      z-index: 2;
    }

    /* الرأس */

    header {
      text-align: center;
      margin-bottom: 45px;
    }

    .logo {
      width: 92px;
      height: 92px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      font-size: 38px;
      border-radius: 28px;

      background:
        linear-gradient(145deg,
          rgba(255,255,255,.13),
          rgba(185,103,255,.08));

      border: 1px solid var(--border);

      box-shadow:
        0 0 15px rgba(185,103,255,.35),
        0 0 45px rgba(185,103,255,.12),
        inset 0 0 25px rgba(255,255,255,.04);

      transform: perspective(700px) rotateX(8deg);
    }

    h1 {
      font-size: clamp(30px, 7vw, 52px);
      letter-spacing: -1px;
      text-shadow:
        0 0 8px rgba(255,255,255,.35),
        0 0 28px rgba(185,103,255,.55);
    }

    header p {
      margin-top: 12px;
      color: var(--gray);
      font-size: 14px;
    }

    /* زر الإدارة */

    .admin-button {
      display: block;
      margin: 0 auto 30px;
      padding: 12px 22px;
      color: white;
      background: rgba(185,103,255,.09);
      border: 1px solid rgba(185,103,255,.45);
      border-radius: 14px;
      cursor: pointer;
      font-size: 14px;

      box-shadow:
        0 0 18px rgba(185,103,255,.12);

      transition: .25s;
    }

    .admin-button:hover {
      background: rgba(185,103,255,.18);
      box-shadow:
        0 0 25px rgba(185,103,255,.3);
    }

    /* الروابط */

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 25px;
    }

    .link-card {
      position: relative;
      min-height: 150px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 25px;

      color: white;
      text-decoration: none;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.095),
          rgba(255,255,255,.025)
        );

      border: 1px solid var(--border);
      border-radius: 25px;

      backdrop-filter: blur(18px);

      transform:
        perspective(900px)
        rotateX(4deg)
        rotateY(-4deg);

      box-shadow:
        14px 18px 35px rgba(0,0,0,.55),
        inset 1px 1px 0 rgba(255,255,255,.08),
        0 0 0 rgba(185,103,255,0);

      transition:
        transform .3s ease,
        box-shadow .3s ease,
        border-color .3s ease;
    }

    .link-card:hover {
      transform:
        perspective(900px)
        rotateX(0)
        rotateY(0)
        translateY(-9px)
        scale(1.02);

      border-color: rgba(213,155,255,.75);

      box-shadow:
        18px 25px 45px rgba(0,0,0,.6),
        0 0 28px rgba(185,103,255,.25),
        inset 0 0 25px rgba(185,103,255,.04);
    }

    .icon {
      flex: 0 0 66px;
      width: 66px;
      height: 66px;

      display: grid;
      place-items: center;

      border-radius: 20px;

      background:
        linear-gradient(145deg,
          rgba(255,255,255,.12),
          rgba(185,103,255,.08));

      border: 1px solid rgba(255,255,255,.12);

      font-size: 30px;

      box-shadow:
        7px 9px 18px rgba(0,0,0,.45),
        0 0 20px rgba(185,103,255,.15),
        inset 2px 2px 8px rgba(255,255,255,.05);
    }

    .info {
      min-width: 0;
      flex: 1;
    }

    .info h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .info p {
      color: var(--gray);
      font-size: 13px;
      line-height: 1.6;
    }

    .arrow {
      color: var(--purple-light);
      font-size: 25px;
      transition: transform .25s;
    }

    .link-card:hover .arrow {
      transform: translateX(-6px);
      text-shadow: 0 0 12px var(--purple);
    }

    /* لوحة الإدارة */

    .admin-panel {
      display: none;
      margin: 35px 0;
      padding: 25px;

      background: rgba(8, 7, 12, .88);
      border: 1px solid rgba(185,103,255,.35);
      border-radius: 22px;

      box-shadow:
        0 0 35px rgba(185,103,255,.12),
        inset 0 0 25px rgba(255,255,255,.02);

      backdrop-filter: blur(20px);
    }

    .admin-panel.active {
      display: block;
    }

    .admin-title {
      font-size: 20px;
      margin-bottom: 20px;
      color: var(--purple-light);
    }

    .admin-item {
      display: grid;
      grid-template-columns: 55px 1fr 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .admin-item input {
      width: 100%;
      padding: 12px;

      color: white;
      background: rgba(255,255,255,.05);

      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;

      outline: none;
    }

    .admin-item input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 12px rgba(185,103,255,.15);
    }

    .save-button,
    .delete-button,
    .add-button {
      border: 0;
      border-radius: 10px;
      padding: 11px 15px;
      cursor: pointer;
      color: white;
      font-weight: bold;
    }

    .save-button {
      background: rgba(185,103,255,.2);
      border: 1px solid rgba(185,103,255,.5);
    }

    .delete-button {
      background: rgba(255,70,90,.12);
      border: 1px solid rgba(255,70,90,.35);
    }

    .add-button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: linear-gradient(
        135deg,
        #9d4edd,
        #c77dff
      );
      box-shadow: 0 0 22px rgba(185,103,255,.25);
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: var(--gray);
    }

    footer {
      margin-top: 50px;
      text-align: center;
      color: #666675;
      font-size: 12px;
    }

    /* الجوال */

    @media (max-width: 700px) {
      .container {
        padding-top: 35px;
      }

      .links {
        grid-template-columns: 1fr;
      }

      .admin-item {
        grid-template-columns: 1fr;
      }

      .admin-item input {
        min-height: 45px;
      }

      .admin-item .icon-input {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="glow one"></div>
  <div class="glow two"></div>

  <main class="container">

    <header>
      <div class="logo">🔗</div>

      <h1>روابطي</h1>

      <p>
        جميع الروابط في مكان واحد
      </p>
    </header>

    <button
      class="admin-button"
      id="adminToggle"
      type="button"
    >
      ⚙️ إدارة الروابط
    </button>

    <!-- لوحة إضافة وتعديل الروابط -->

    <section
      class="admin-panel"
      id="adminPanel"
    >

      <div class="admin-title">
        إدارة الروابط
      </div>

      <div id="adminList"></div>

      <button
        class="add-button"
        id="addLink"
        type="button"
      >
        ＋ إضافة رابط جديد
      </button>

    </section>

    <!-- الروابط -->

    <section
      class="links"
      id="linksContainer"
    ></section>

    <footer>
      © 2026 — جميع الحقوق محفوظة
    </footer>

  </main>

  <script>

    /*
      ============================================================
      الروابط الافتراضية
      ============================================================
    */

    const defaultLinks = [
      {
        name: "تلجرام 1",
        description: "قناة التلجرام الأولى",
        url: "https://t.me/your_channel_1",
        icon: "✈️"
      },

      {
        name: "تلجرام 2",
        description: "قناة التلجرام الثانية",
        url: "https://t.me/your_channel_2",
        icon: "✈️"
      },

      {
        name: "رابط 3",
        description: "الموقع أو الخدمة الثالثة",
        url: "https://example.com",
        icon: "🌐"
      }
    ];


    /*
      ============================================================
      تحميل الروابط من الجهاز
      ============================================================
    */

    let links = loadLinks();


    function loadLinks() {

      try {

        const saved = localStorage.getItem("myLinks");

        if (saved) {
          return JSON.parse(saved);
        }

      } catch (error) {

        console.error(
          "تعذر تحميل الروابط:",
          error
        );

      }

      return structuredClone(defaultLinks);
    }


    /*
      ============================================================
      حفظ الروابط
      ============================================================
    */

    function saveLinks() {

      localStorage.setItem(
        "myLinks",
        JSON.stringify(links)
      );

    }


    /*
      ============================================================
      عرض البطاقات
      ============================================================
    */

    function renderLinks() {

      const container =
        document.getElementById("linksContainer");

      container.innerHTML = "";

      if (links.length === 0) {

        container.innerHTML = `
          <div class="empty">
            لا توجد روابط حاليًا.
          </div>
        `;

        return;
      }


      links.forEach((link) => {

        const card =
          document.createElement("a");

        card.className = "link-card";

        card.href = link.url;

        card.target = "_blank";

        card.rel = "noopener noreferrer";


        card.innerHTML = `

          <div class="icon">
            ${escapeHtml(link.icon)}
          </div>

          <div class="info">

            <h2>
              ${escapeHtml(link.name)}
            </h2>

            <p>
              ${escapeHtml(link.description)}
            </p>

          </div>

          <div class="arrow">
            ←
          </div>

        `;


        container.appendChild(card);

      });

    }


    /*
      ============================================================
      لوحة الإدارة
      ============================================================
    */

    function renderAdmin() {

      const adminList =
        document.getElementById("adminList");

      adminList.innerHTML = "";


      links.forEach((link, index) => {

        const item =
          document.createElement("div");

        item.className = "admin-item";


        item.innerHTML = `

          <input
            class="icon-input"
            value="${escapeAttribute(link.icon)}"
            placeholder="أيقونة"
            aria-label="الأيقونة"
          >

          <input
            value="${escapeAttribute(link.name)}"
            placeholder="اسم الرابط"
            aria-label="اسم الرابط"
          >

          <input
            value="${escapeAttribute(link.url)}"
            placeholder="https://example.com"
            dir="ltr"
            aria-label="الرابط"
          >

          <div>

            <button
              class="save-button"
              type="button"
              data-action="save"
            >
              حفظ
            </button>

            <button
              class="delete-button"
              type="button"
              data-action="delete"
            >
              حذف
            </button>

          </div>

        `;


        const inputs =
          item.querySelectorAll("input");


        item.querySelector(
          '[data-action="save"]'
        ).addEventListener(
          "click",
          () => {

            const newIcon =
              inputs[0].value.trim() || "🔗";

            const newName =
              inputs[1].value.trim();

            const newUrl =
              inputs[2].value.trim();


            if (!newName || !newUrl) {

              alert(
                "اكتب اسم الرابط والرابط أولًا."
              );

              return;
            }


            links[index] = {

              ...links[index],

              icon: newIcon,
              name: newName,
              url: newUrl

            };


            saveLinks();

            renderLinks();

            renderAdmin();

          }
        );


        item.querySelector(
          '[data-action="delete"]'
        ).addEventListener(
          "click",
          () => {

            links.splice(index, 1);

            saveLinks();

            renderLinks();

            renderAdmin();

          }
        );


        adminList.appendChild(item);

      });

    }


    /*
      ============================================================
      فتح وإغلاق لوحة الإدارة
      ============================================================
    */

    document
      .getElementById("adminToggle")
      .addEventListener(
        "click",
        () => {

          const panel =
            document.getElementById("adminPanel");

          panel.classList.toggle("active");

          if (panel.classList.contains("active")) {
            renderAdmin();
          }

        }
      );


    /*
      ============================================================
      إضافة رابط جديد
      ============================================================
    */

    document
      .getElementById("addLink")
      .addEventListener(
        "click",
        () => {

          links.push({

            name: "رابط جديد",

            description: "اضغط لتعديل هذا الرابط",

            url: "https://example.com",

            icon: "🔗"

          });


          saveLinks();

          renderLinks();

          renderAdmin();

        }
      );


    /*
      ============================================================
      حماية النصوص من HTML
      ============================================================
    */

    function escapeHtml(value) {

      return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

    }


    function escapeAttribute(value) {

      return escapeHtml(value);

    }


    /*
      ============================================================
      التشغيل
      ============================================================
    */

    renderLinks();

  </script>

</body>
        </html>
